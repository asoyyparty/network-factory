<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peta Jaringan Pabrik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B1220;
    --panel: #121B2E;
    --panel-2: #16213A;
    --border: #223050;
    --grid-line: #16324A;
    --text: #DCE6EE;
    --text-muted: #7189A3;
    --accent: #2FB8C6;
    --accent-dim: #1D6E77;
    --ok: #5FBF7A;
    --warn: #E0B23F;
    --alert: #E0663F;
    --idle: #3A4658;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 34px 34px;
    background-attachment: fixed;
  }
  ::selection{background:var(--accent-dim); color:#fff;}
  button{font-family:var(--sans); cursor:pointer;}
  input, select, textarea{font-family:var(--sans);}
  a{color:var(--accent);}

  #app{display:flex; flex-direction:column; height:100vh;}

  /* HEADER */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; border-bottom:1px solid var(--border);
    background:rgba(18,27,46,0.85); backdrop-filter: blur(6px);
    flex-shrink:0; flex-wrap:wrap; gap:10px;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:34px; height:34px; border:2px solid var(--accent); border-radius:4px;
    display:flex; align-items:center; justify-content:center; position:relative; flex-shrink:0;
  }
  .brand-mark::before{content:''; position:absolute; width:6px; height:6px; background:var(--accent); border-radius:50%;}
  .brand-mark::after{content:''; position:absolute; width:18px; height:18px; border:1px solid var(--accent-dim); border-radius:50%;}
  .brand-text h1{font-family:var(--mono); font-size:15px; font-weight:600; margin:0; letter-spacing:0.5px; color:#fff;}
  .brand-text p{margin:2px 0 0; font-size:11.5px; color:var(--text-muted); font-family:var(--mono);}
  .stats{display:flex; gap:8px; flex-wrap:wrap;}
  .stat-chip{
    font-family:var(--mono); font-size:11px; padding:6px 10px; border:1px solid var(--border);
    border-radius:3px; background:var(--panel); color:var(--text-muted); display:flex; gap:6px; align-items:center;
  }
  .stat-chip b{color:#fff; font-size:12.5px;}
  .stat-chip .dot{width:7px; height:7px; border-radius:50%; display:inline-block;}

  /* LAYOUT */
  .layout{display:flex; flex:1; min-height:0;}
  aside{
    width:290px; flex-shrink:0; border-right:1px solid var(--border);
    background:rgba(18,27,46,0.6); display:flex; flex-direction:column; min-height:0;
  }
  .search-box{padding:12px; border-bottom:1px solid var(--border);}
  .search-box input{
    width:100%; padding:8px 10px; background:var(--panel-2); border:1px solid var(--border);
    color:var(--text); border-radius:3px; font-size:13px;
  }
  .search-box input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .zone-list{flex:1; overflow-y:auto; padding:6px;}
  .zone-group{margin-bottom:2px;}
  .zone-head{
    display:flex; align-items:center; justify-content:space-between; padding:8px 10px;
    cursor:pointer; border-radius:3px; user-select:none;
  }
  .zone-head:hover{background:var(--panel-2);}
  .zone-head:focus-visible{outline:2px solid var(--accent);}
  .zone-head .zname{font-family:var(--mono); font-size:12px; font-weight:600; color:#fff; display:flex; align-items:center; gap:6px;}
  .zone-head .zcount{font-family:var(--mono); font-size:10.5px; color:var(--text-muted);}
  .zone-head .chevron{color:var(--text-muted); font-size:10px; transition:transform 0.15s;}
  .zone-group.open .chevron{transform:rotate(90deg);}
  .zone-items{max-height:0; overflow:hidden; transition:max-height 0.2s ease;}
  .zone-group.open .zone-items{max-height:1000px;}
  .loc-item{
    padding:6px 10px 6px 26px; font-size:12.5px; color:var(--text-muted); cursor:pointer;
    border-left:2px solid transparent; display:flex; align-items:center; gap:6px;
  }
  .loc-item:hover{background:var(--panel-2); color:var(--text);}
  .loc-item.active{border-left-color:var(--accent); color:#fff; background:var(--panel-2);}
  .loc-item .status-dot{width:6px; height:6px; border-radius:50%; flex-shrink:0;}
  .loc-item.hidden, .zone-group.hidden{display:none;}

  /* MAIN */
  main{flex:1; min-width:0; display:flex; flex-direction:column; position:relative;}
  .tabs{display:flex; gap:2px; padding:10px 16px 0; border-bottom:1px solid var(--border); flex-shrink:0;}
  .tab-btn{
    background:transparent; border:1px solid var(--border); border-bottom:none; color:var(--text-muted);
    padding:8px 16px; font-size:12px; font-family:var(--mono); border-radius:4px 4px 0 0;
    position:relative; top:1px;
  }
  .tab-btn.active{background:var(--panel); color:#fff; border-color:var(--border);}
  .view{flex:1; min-height:0; position:relative; overflow:hidden;}
  .view-panel{display:none; height:100%;}
  .view-panel.active{display:block;}

  /* TOPOLOGY */
  #topo-wrap{width:100%; height:100%; overflow:hidden; position:relative; cursor:grab;}
  #topo-wrap.grabbing{cursor:grabbing;}
  #topo-inner{position:absolute; top:0; left:0; transform-origin: 0 0;}
  .topo-controls{
    position:absolute; top:14px; right:14px; display:flex; flex-direction:column; gap:6px; z-index:5;
  }
  .topo-btn{
    width:30px; height:30px; background:var(--panel); border:1px solid var(--border); color:var(--text);
    border-radius:4px; font-size:15px; display:flex; align-items:center; justify-content:center;
  }
  .topo-btn:hover{border-color:var(--accent); color:var(--accent);}
  .legend{
    position:absolute; bottom:14px; left:14px; background:rgba(18,27,46,0.9); border:1px solid var(--border);
    border-radius:5px; padding:10px 14px; font-family:var(--mono); font-size:10.5px; color:var(--text-muted); z-index:5;
  }
  .legend-row{display:flex; align-items:center; gap:7px; margin:4px 0;}
  .legend-swatch{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .hint{
    position:absolute; top:14px; left:14px; background:rgba(18,27,46,0.9); border:1px solid var(--border);
    border-radius:5px; padding:8px 12px; font-size:11px; color:var(--text-muted); z-index:5; max-width:220px;
  }

  svg text{font-family:var(--mono); user-select:none;}
  .core-node{fill:var(--panel); stroke:var(--accent); stroke-width:2;}
  .core-label{fill:#fff; font-size:11px; font-weight:600;}
  .zone-hub{fill:var(--panel-2); stroke:var(--accent-dim); stroke-width:1.5;}
  .zone-hub-label{fill:var(--accent); font-size:10px; font-weight:600;}
  .trunk-line{stroke:var(--accent-dim); stroke-width:1.4; fill:none;}
  .busbar-line{stroke:var(--border); stroke-width:1.2;}
  .stub-line{stroke:var(--border); stroke-width:1.2;}
  .building-node{stroke:#0B1220; stroke-width:1.5; cursor:pointer;}
  .building-node:hover{stroke:#fff;}
  .building-label{fill:var(--text-muted); font-size:8.5px; cursor:pointer;}
  .building-label:hover{fill:#fff;}
  .building-count{fill:var(--bg); font-size:7px; font-weight:600;}

  /* DETAIL */
  #detail-panel{height:100%; overflow-y:auto; padding:22px 28px;}
  .empty-state{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--text-muted); text-align:center; gap:8px;
  }
  .empty-state .big-icon{font-size:34px; opacity:0.4; font-family:var(--mono);}
  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:6px; flex-wrap:wrap;}
  .back-link{
    background:none; border:none; color:var(--accent); font-family:var(--mono); font-size:11.5px; padding:0;
    margin-bottom:12px; display:inline-flex; align-items:center; gap:5px;
  }
  .detail-head h2{font-size:19px; margin:0 0 4px; color:#fff;}
  .zone-badge{
    font-family:var(--mono); font-size:10.5px; color:var(--accent); border:1px solid var(--accent-dim);
    padding:3px 8px; border-radius:3px; display:inline-block;
  }
  .add-btn{
    background:var(--accent); color:#04202A; border:none; padding:9px 16px; border-radius:4px;
    font-size:12.5px; font-weight:600; font-family:var(--mono); white-space:nowrap;
  }
  .add-btn:hover{background:#3fd0e0;}
  .device-table{width:100%; border-collapse:collapse; margin-top:16px; font-size:12.5px;}
  .device-table th{
    text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); color:var(--text-muted);
    font-family:var(--mono); font-weight:500; font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px;
  }
  .device-table td{padding:9px 10px; border-bottom:1px solid var(--grid-line); vertical-align:middle;}
  .device-table tr:hover td{background:rgba(255,255,255,0.02);}
  .ip-cell{font-family:var(--mono); color:var(--text-muted);}
  .status-badge{
    font-family:var(--mono); font-size:10px; padding:3px 8px; border-radius:10px; display:inline-flex;
    align-items:center; gap:5px; font-weight:600;
  }
  .status-badge .d{width:6px; height:6px; border-radius:50%;}
  .row-actions{display:flex; gap:6px;}
  .icon-btn{
    background:none; border:1px solid var(--border); color:var(--text-muted); width:26px; height:26px;
    border-radius:3px; font-size:12px; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{border-color:var(--accent); color:var(--accent);}
  .icon-btn.danger:hover{border-color:var(--alert); color:var(--alert);}
  .no-devices{padding:30px 0; text-align:center; color:var(--text-muted); font-size:13px;}

  /* FORM */
  .device-form{
    background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:18px;
    margin-top:16px; display:none;
  }
  .device-form.open{display:block;}
  .form-title{font-family:var(--mono); font-size:12px; color:var(--accent); margin:0 0 14px; text-transform:uppercase; letter-spacing:0.5px;}
  .form-grid{display:grid; grid-template-columns: repeat(3, 1fr); gap:12px;}
  .field label{display:block; font-size:11px; color:var(--text-muted); margin-bottom:5px; font-family:var(--mono);}
  .field input, .field select, .field textarea{
    width:100%; padding:8px 9px; background:var(--panel-2); border:1px solid var(--border);
    color:var(--text); border-radius:3px; font-size:12.5px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--accent); outline-offset:0;}
  .field.span-2{grid-column:span 2;}
  .field.span-3{grid-column:span 3;}
  .form-actions{display:flex; gap:8px; margin-top:14px; justify-content:flex-end;}
  .btn-secondary{
    background:transparent; border:1px solid var(--border); color:var(--text-muted); padding:8px 14px;
    border-radius:4px; font-size:12px; font-family:var(--mono);
  }
  .btn-primary{
    background:var(--accent); border:none; color:#04202A; padding:8px 16px; border-radius:4px;
    font-size:12px; font-weight:600; font-family:var(--mono);
  }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--panel); border:1px solid var(--accent); color:#fff; padding:10px 18px; border-radius:5px;
    font-family:var(--mono); font-size:12px; transition:all 0.25s; z-index:100; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:5px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent-dim);}

  @media (max-width: 780px){
    aside{position:absolute; z-index:20; height:100%; transform:translateX(-100%); transition:transform 0.2s;}
    aside.mobile-open{transform:translateX(0);}
    .form-grid{grid-template-columns: 1fr 1fr;}
    .field.span-2, .field.span-3{grid-column:span 2;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text">
        <h1>PETA JARINGAN PABRIK</h1>
        <p>Inventaris perangkat &amp; topologi jaringan per gedung</p>
      </div>
    </div>
    <div class="stats" id="stats-bar"></div>
  </header>
  <div class="layout">
    <aside>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Cari gedung / ruang...">
      </div>
      <div class="zone-list" id="zone-list"></div>
    </aside>
    <main>
      <div class="tabs">
        <button class="tab-btn active" data-tab="topo">Peta Topologi</button>
        <button class="tab-btn" data-tab="detail" id="tab-detail-btn">Detail Lokasi</button>
      </div>
      <div class="view">
        <div class="view-panel active" id="view-topo">
          <div id="topo-wrap">
            <div id="topo-inner"></div>
            <div class="hint">Geser untuk memindai peta, scroll / tombol untuk memperbesar. Klik simpul gedung untuk melihat detail perangkat.</div>
            <div class="topo-controls">
              <button class="topo-btn" id="zoom-in">+</button>
              <button class="topo-btn" id="zoom-out">–</button>
              <button class="topo-btn" id="zoom-reset" style="font-size:11px;">⤾</button>
            </div>
            <div class="legend">
              <div class="legend-row"><span class="legend-swatch" style="background:var(--ok)"></span> Semua perangkat online</div>
              <div class="legend-row"><span class="legend-swatch" style="background:var(--warn)"></span> Ada perangkat maintenance</div>
              <div class="legend-row"><span class="legend-swatch" style="background:var(--alert)"></span> Ada perangkat offline</div>
              <div class="legend-row"><span class="legend-swatch" style="background:var(--idle)"></span> Belum ada data perangkat</div>
            </div>
          </div>
        </div>
        <div class="view-panel" id="view-detail">
          <div id="detail-panel"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const ZONES = [
  {key:'PRODUKSI', label:'Area Produksi Utama'},
  {key:'A', label:'Zona A'},
  {key:'B', label:'Zona B'},
  {key:'C', label:'Zona C'},
  {key:'D', label:'Zona D'},
  {key:'E', label:'Zona E'},
  {key:'F', label:'Zona F'},
  {key:'G', label:'Zona G'},
  {key:'H', label:'Zona H'},
  {key:'I', label:'Zona I'},
  {key:'J', label:'Zona J'},
  {key:'SECURITY', label:'Keamanan'},
  {key:'MESS', label:'Mess Karyawan'},
  {key:'GUDANG_EKS', label:'Gudang Eksternal'},
  {key:'INTI', label:'Inti Jaringan'},
  {key:'GUDANG_IT_AREA', label:'Area Gudang IT'},
  {key:'MULSA', label:'Area Mulsa'}
];

const RAW_LOCATIONS = [
  ['LAB SPRAYER','PRODUKSI'],['RUANG UKK','PRODUKSI'],['RUANG ATK','PRODUKSI'],['RUANG BENIH','PRODUKSI'],
  ['LAB LT. 1','PRODUKSI'],['LAB LT. 2','PRODUKSI'],['KANTOR PRODUKSI LT. 1','PRODUKSI'],['KANTOR PRODUKSI LT. 2','PRODUKSI'],
  ['GEDUNG A1','A'],['GEDUNG A2','A'],['GEDUNG A3','A'],['GEDUNG A3 - OFFICE','A'],
  ['GEDUNG B1 - PROD CF','B'],['GEDUNG B1 - OFFICE GUDANG RMT C12','B'],['GEDUNG B2','B'],['GEDUNG B3 - OFFICE MTC LT. 1','B'],
  ['GEDUNG B3 - MTC LT. 2','B'],['GEDUNG B4 - IF','B'],['GEDUNG B4 - IF OFFICE','B'],['GEDUNG B5 - MP','B'],
  ['GEDUNG C1 - GUDANG RMT MLS','C'],['GEDUNG C2 - PROD MLS','C'],['GEDUNG C2 - OFFICE MLS','C'],
  ['GEDUNG D1 - PROD BOTOL','D'],['GEDUNG D2 - PROD BOTOL','D'],['GEDUNG D2 - OFFICE BOTOL','D'],['GEDUNG D3','D'],
  ['GEDUNG D3 - OFFICE GUDANG RMT BTL','D'],['GEDUNG D4','D'],['GEDUNG D5 - MINI LAB','D'],
  ['GEDUNG E1','E'],['GEDUNG E1 - OFFICE','E'],['GEDUNG E2','E'],['GEDUNG E3','E'],['GEDUNG E3 - OFFICE REAKTOR','E'],
  ['GEDUNG E4','E'],['GEDUNG E5','E'],['GEDUNG E5 - OFFICE PRODUKSI MT','E'],
  ['GEDUNG F1','F'],['GEDUNG F1 - OFFICE GDG RMT','F'],['GEDUNG F2','F'],['GEDUNG F2 - OFFICE GDG RMT','F'],
  ['GEDUNG F3','F'],['GEDUNG F3 - OFFICE GDG RMT','F'],['GEDUNG F4','F'],['GEDUNG F4 - OFFICE PROD FL','F'],
  ['GEDUNG F5','F'],['GEDUNG F5 - OFFICE','F'],
  ['GEDUNG G1','G'],['GEDUNG G2','G'],
  ['GEDUNG H1','H'],['GEDUNG H2','H'],['GEDUNG H2 - OFFICE','H'],['GEDUNG H3','H'],
  ['GEDUNG I1','I'],['GEDUNG I2','I'],['GEDUNG I3','I'],['GEDUNG I3 - OFFICE GDG RMT','I'],['GEDUNG I4','I'],['GEDUNG I5','I'],
  ['GEDUNG J','J'],['GEDUNG J - OFFICE','J'],
  ['POS SECURITY','SECURITY'],
  ['MESS DALAM KABAG','MESS'],['MESS LAES - LAJANG','MESS'],['MESS LAES - KELUARGA','MESS'],
  ['MESS CIKANDE - DEPAN','MESS'],['MESS CIKANDE - BELAKANG','MESS'],
  ['GUDANG RMT LEGOK','GUDANG_EKS'],['GUDANG RMT CEMPLANG','GUDANG_EKS'],
  ['GUDANG IT','INTI'],['KANTOR BARU LT 1','INTI'],['KANTOR BARU LT 2','INTI'],
  ['QC LAB','GUDANG_IT_AREA'],['R&D PES','GUDANG_IT_AREA'],['OFFICE LAB','GUDANG_IT_AREA'],
  ['MUSHOLLA','GUDANG_IT_AREA'],['PRIMAXON','GUDANG_IT_AREA'],['KANTOR R&D PLS','GUDANG_IT_AREA'],
  ['MESIN','E'],['GUDANG BOTOL','D'],['KANTIN ATAS','E'],
  ['KANTOR GUDANG MULSA','MULSA'],['ATAS TANGGAL OFFICE MULSA','MULSA'],
  ['GERBANG PRODUKSI MULSA','MULSA'],['POS SECURITY MULSA','MULSA']
];

const SEED_LOCATIONS = RAW_LOCATIONS.map((r,i)=>({id:'l'+(i+1), nama:r[0], zone:r[1]}));

function findLocId(name){
  const l = SEED_LOCATIONS.find(x=>x.nama===name);
  return l ? l.id : null;
}

/* Node helpers for the network flow tree.
   B = building/location node (clickable, tied to device inventory)
   N = infra node (router/switch/converter — visual connector only, per user's choice) */
function B(label, locName, children){
  return {kind:'building', label, locId: findLocId(locName), children: children||[]};
}
function N(label, children, extra){
  return Object.assign({kind:'infra', label, children: children||[]}, extra||{});
}

/* Shared backbone: both ISP lines converge here before fanning out to every building. */
const MIKROTIK_CBA = N('Mikrotik CBA', [
  N('Fortigate', [
    N('Switch MG HP Aruba', [
      N('Switch VLAN 2 CCTV', []),
      N('Lantai 1 Lab', [ B('QC Lab','QC LAB',[]), B('R&D PES','R&D PES',[]) ]),
      N('Lantai 2 Lab', [ B('Office Lab','OFFICE LAB',[]), B('Musholla','MUSHOLLA',[]) ]),
      N('Link FO Kantor Baru (202m)', [
        N('Convert FO to LAN', [
          N('Switch MG Distribusi', [
            N('Switch MG A', [ B('Kantor Baru LT 2','KANTOR BARU LT 2',[]) ]),
            N('Switch MG B', [ B('Kantor Baru LT 2','KANTOR BARU LT 2',[]) ]),
            N('Switch MG C', [ B('Kantor Baru LT 1','KANTOR BARU LT 1',[]) ]),
            N('Switch MG D', [ B('Kantor Baru LT 1','KANTOR BARU LT 1',[]) ]),
            N('Convert LAN to FO', [
              N('RM Gedung A3', [
                B('Gedung A1','GEDUNG A1',[]),
                B('Gedung A2','GEDUNG A2',[]),
                B('Gudang RMT C12','GEDUNG B1 - OFFICE GUDANG RMT C12',[]),
                B('Office MTC Lt. 1','GEDUNG B3 - OFFICE MTC LT. 1',[]),
                B('MTC Lt. 2','GEDUNG B3 - MTC LT. 2',[])
              ]),
              N('RM Kantor CF B2', [ B('Kantor CF B2','GEDUNG B1 - PROD CF',[]) ]),
              N('RM MP Baru B4', [ B('MP Baru B4','GEDUNG B5 - MP',[]) ]),
              N('RM Gudang F5', [
                B('Gedung J','GEDUNG J',[]),
                B('Gedung F3','GEDUNG F3',[]),
                B('Mess Kabag','MESS DALAM KABAG',[])
              ]),
              N('RM Kantor F1', [ B('Gedung F4','GEDUNG F4',[]) ]),
              N('RM Gedung H2 Assembling', [ B('Gedung I3','GEDUNG I3',[]) ]),
              N('RM Kantor Methyl', [
                B('Kantor Reaktor','GEDUNG E3 - OFFICE REAKTOR',[]),
                B('Mesin','MESIN',[])
              ]),
              N('RM Mini Lab D5', [
                B('Gudang Botol','GUDANG BOTOL',[]),
                B('Officer D2','GEDUNG D2 - OFFICE BOTOL',[]),
                B('Gedung D1','GEDUNG D1 - PROD BOTOL',[])
              ]),
              N('RM Kantor Filling', [
                B('Gedung E3','GEDUNG E3',[]),
                B('Kantin Atas','KANTIN ATAS',[])
              ]),
              N('RM Kantor Mulsa', [
                B('Kantor Gudang Mulsa','KANTOR GUDANG MULSA',[]),
                B('Atas Tanggal Office Mulsa','ATAS TANGGAL OFFICE MULSA',[]),
                N('SW MG Gerbang Prod Mulsa', [ B('Gerbang Produksi Mulsa','GERBANG PRODUKSI MULSA',[]) ]),
                N('SW MG Pos Security', [ B('Pos Security Mulsa','POS SECURITY MULSA',[]) ])
              ])
            ])
          ])
        ])
      ]),
      B('Primaxon','PRIMAXON',[]),
      B('Kantor R&D PLS','KANTOR R&D PLS',[])
    ])
  ])
], {id:'mikrotik_cba', extraParents:['mikrotik_maxindo']});

const NETWORK_TREE = B('GUDANG IT', 'GUDANG IT', [
  N('Fiber Optik STP', [
    N('ODP Fiber Optik STP', [
      N('Mikrotik STP', [ MIKROTIK_CBA ])
    ])
  ]),
  N('Fiber Optik Maxindo', [
    N('ODP Fiber Optik Maxindo', [
      N('Router FO Telkom / Radio Wireless FR BSM', [
        N('Mikrotik Maxindo', [], {id:'mikrotik_maxindo'})
      ])
    ])
  ])
]);

const DEVICE_TYPES = ['Router','Switch','Access Point','Server','CCTV','Modem/ONT','Lainnya'];
const STATUS_LIST = ['Online','Offline','Maintenance'];
const STATUS_COLOR = {Online:'var(--ok)', Offline:'var(--alert)', Maintenance:'var(--warn)'};

let state = {
  locations: SEED_LOCATIONS,
  devices: {}, // locationId -> [ {id,nama,tipe,merk,ip,status,catatan} ]
};
let currentLocId = null;
let editingDeviceId = null;
let storageOk = true;

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

function uid(){ return 'd' + Math.random().toString(36).slice(2,10); }

function showToast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

async function loadData(){
  try{
    const res = await window.storage.get('network-inventory', false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(parsed && Array.isArray(parsed.locations)) return parsed;
    }
  }catch(e){
    console.warn('Belum ada data tersimpan, memakai data awal.', e);
  }
  return null;
}

async function saveData(){
  try{
    const res = await window.storage.set('network-inventory', JSON.stringify(state), false);
    if(!res){ storageOk = false; showToast('Gagal menyimpan — perubahan mungkin tidak tersimpan'); }
  }catch(e){
    console.error('Storage error', e);
    storageOk = false;
    showToast('Gagal menyimpan ke penyimpanan');
  }
}

function locationsByZone(zoneKey){
  return state.locations.filter(l => l.zone === zoneKey);
}

function deviceCount(locId){
  return (state.devices[locId] || []).length;
}

function locationAggregateStatus(locId){
  const devs = state.devices[locId] || [];
  if(devs.length === 0) return 'idle';
  if(devs.some(d=>d.status==='Offline')) return 'alert';
  if(devs.some(d=>d.status==='Maintenance')) return 'warn';
  return 'ok';
}
const AGG_COLOR = {ok:'var(--ok)', warn:'var(--warn)', alert:'var(--alert)', idle:'var(--idle)'};

/* ---------- STATS BAR ---------- */
function renderStats(){
  const totalLoc = state.locations.length;
  let totalDev = 0, online=0, offline=0, maint=0;
  Object.values(state.devices).forEach(list=>{
    list.forEach(d=>{
      totalDev++;
      if(d.status==='Online') online++;
      else if(d.status==='Offline') offline++;
      else if(d.status==='Maintenance') maint++;
    });
  });
  $('#stats-bar').innerHTML = `
    <div class="stat-chip">Lokasi <b>${totalLoc}</b></div>
    <div class="stat-chip">Perangkat <b>${totalDev}</b></div>
    <div class="stat-chip"><span class="dot" style="background:var(--ok)"></span>Online <b>${online}</b></div>
    <div class="stat-chip"><span class="dot" style="background:var(--alert)"></span>Offline <b>${offline}</b></div>
    <div class="stat-chip"><span class="dot" style="background:var(--warn)"></span>Maint. <b>${maint}</b></div>
  `;
}

/* ---------- SIDEBAR ---------- */
function renderSidebar(){
  const container = $('#zone-list');
  container.innerHTML = '';
  ZONES.forEach(zone=>{
    const locs = locationsByZone(zone.key);
    if(locs.length===0) return;
    const totalDev = locs.reduce((s,l)=>s+deviceCount(l.id),0);
    const group = document.createElement('div');
    group.className = 'zone-group';
    group.dataset.zone = zone.key;
    group.innerHTML = `
      <div class="zone-head" tabindex="0" role="button">
        <span class="zname"><span class="chevron">▶</span> ${zone.label}</span>
        <span class="zcount">${locs.length} lok · ${totalDev} dev</span>
      </div>
      <div class="zone-items"></div>
    `;
    const itemsWrap = $('.zone-items', group);
    locs.forEach(loc=>{
      const item = document.createElement('div');
      item.className = 'loc-item';
      item.dataset.locId = loc.id;
      const agg = locationAggregateStatus(loc.id);
      item.innerHTML = `<span class="status-dot" style="background:${AGG_COLOR[agg]}"></span><span class="loc-name">${loc.nama}</span>`;
      item.addEventListener('click', ()=> openDetail(loc.id));
      itemsWrap.appendChild(item);
    });
    const head = $('.zone-head', group);
    head.addEventListener('click', ()=> group.classList.toggle('open'));
    head.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); group.classList.toggle('open'); }});
    container.appendChild(group);
  });
  highlightActiveLoc();
}

function highlightActiveLoc(){
  $$('.loc-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.locId === currentLocId);
  });
}

$('#search-input').addEventListener('input', (e)=>{
  const q = e.target.value.trim().toLowerCase();
  $$('.zone-group').forEach(group=>{
    let anyMatch = false;
    $$('.loc-item', group).forEach(item=>{
      const match = item.textContent.toLowerCase().includes(q);
      item.classList.toggle('hidden', !match);
      if(match) anyMatch = true;
    });
    group.classList.toggle('hidden', !anyMatch);
    if(q && anyMatch) group.classList.add('open');
    if(!q) group.classList.remove('open');
  });
});

/* ---------- TOPOLOGY SVG ---------- */
let zoomScale = 1, panX = 0, panY = 0;
const XSPACING = 168, YSPACING = 92, BOX_H = 34;

function layoutTree(root){
  let leafX = 0;
  const positions = new Map();
  const idIndex = new Map();
  function visit(node, depth){
    if(node.id) idIndex.set(node.id, node);
    let x;
    if(!node.children || node.children.length===0){
      x = leafX * XSPACING;
      leafX++;
    } else {
      const xs = node.children.map(c=>visit(c, depth+1));
      x = (Math.min(...xs) + Math.max(...xs)) / 2;
    }
    positions.set(node, {x, y: depth*YSPACING, depth});
    return x;
  }
  visit(root, 0);
  return {positions, idIndex, leafCount: leafX};
}

function collectNodes(root){
  const nodes = [];
  (function visit(n){ nodes.push(n); (n.children||[]).forEach(visit); })(root);
  return nodes;
}

function collectEdges(root, idIndex){
  const edges = [];
  (function visit(node, parent){
    if(parent) edges.push({from:parent, to:node, extra:false});
    if(node.extraParents){
      node.extraParents.forEach(pid=>{
        const p = idIndex.get(pid);
        if(p) edges.push({from:p, to:node, extra:true});
      });
    }
    (node.children||[]).forEach(c=>visit(c, node));
  })(root, null);
  return edges;
}

function estimateBoxWidth(label){
  return Math.max(92, Math.min(188, label.length*6.3 + 26));
}

function escapeSvg(str){
  return String(str==null?'':str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildFlowSVG(){
  const {positions, idIndex, leafCount} = layoutTree(NETWORK_TREE);
  const nodes = collectNodes(NETWORK_TREE);
  const edges = collectEdges(NETWORK_TREE, idIndex);
  const maxDepth = Math.max(...nodes.map(n=>positions.get(n).depth));
  const contentW = Math.max(leafCount*XSPACING, 400);
  const contentH = (maxDepth+1)*YSPACING;
  const pad = 70;
  const vbW = contentW + pad*2, vbH = contentH + pad*2 + 40;

  let parts = [];
  edges.forEach(e=>{
    const p1 = positions.get(e.from), p2 = positions.get(e.to);
    const midY = (p1.y + p2.y) / 2;
    const cls = e.extra ? 'flow-edge flow-edge-extra' : 'flow-edge';
    parts.push(`<path class="${cls}" d="M ${p1.x} ${p1.y+BOX_H/2} C ${p1.x} ${midY}, ${p2.x} ${midY}, ${p2.x} ${p2.y-BOX_H/2}"/>`);
  });
  nodes.forEach(n=>{
    const p = positions.get(n);
    const w = estimateBoxWidth(n.label);
    if(n.kind === 'building'){
      const agg = n.locId ? locationAggregateStatus(n.locId) : 'idle';
      const color = AGG_COLOR[agg];
      const count = n.locId ? deviceCount(n.locId) : 0;
      const isRoot = n === NETWORK_TREE;
      parts.push(`<g class="flow-node flow-building" data-loc="${n.locId||''}" tabindex="0">
        <rect x="${(p.x-w/2).toFixed(1)}" y="${(p.y-BOX_H/2).toFixed(1)}" width="${w.toFixed(1)}" height="${BOX_H}" rx="7" fill="${isRoot?'var(--panel-2)':'var(--panel)'}" stroke="${color}" stroke-width="${isRoot?2.5:2}"/>
        <circle cx="${(p.x-w/2+10).toFixed(1)}" cy="${(p.y-BOX_H/2+9).toFixed(1)}" r="4" fill="${color}"/>
        <text x="${(p.x+4).toFixed(1)}" y="${(p.y+3.5).toFixed(1)}" text-anchor="middle" fill="#fff" font-size="${isRoot?10.5:9.5}" font-weight="600">${escapeSvg(n.label)}</text>
        ${count>0 ? `<text x="${(p.x+w/2-11).toFixed(1)}" y="${(p.y-BOX_H/2+11).toFixed(1)}" text-anchor="middle" font-size="7.3" fill="var(--text-muted)">${count}</text>` : ''}
      </g>`);
    } else {
      parts.push(`<g class="flow-node flow-infra">
        <rect x="${(p.x-w/2).toFixed(1)}" y="${(p.y-BOX_H/2).toFixed(1)}" width="${w.toFixed(1)}" height="${BOX_H}" rx="6" fill="var(--panel-2)" stroke="var(--border)" stroke-width="1.3"/>
        <text x="${p.x.toFixed(1)}" y="${(p.y+3).toFixed(1)}" text-anchor="middle" fill="var(--text-muted)" font-size="8.6">${escapeSvg(n.label)}</text>
      </g>`);
    }
  });

  return `<svg width="${vbW}" height="${vbH}" viewBox="0 0 ${vbW} ${vbH}" xmlns="http://www.w3.org/2000/svg"><g transform="translate(${pad},${pad+20})">${parts.join('')}</g></svg>`;
}

function renderTopology(){
  $('#topo-inner').innerHTML = buildFlowSVG();
  $$('.flow-building').forEach(el=>{
    if(!el.dataset.loc) return;
    el.addEventListener('click', ()=> openDetail(el.dataset.loc));
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openDetail(el.dataset.loc); }});
  });
  applyTransform();
}

function applyTransform(){
  $('#topo-inner').style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
}

function fitTopologyToView(){
  const wrap = $('#topo-wrap');
  const svg = $('#topo-inner svg');
  if(svg && wrap){
    const svgW = parseFloat(svg.getAttribute('width'));
    const svgH = parseFloat(svg.getAttribute('height'));
    const scaleW = (wrap.clientWidth - 30) / svgW;
    const scaleH = (wrap.clientHeight - 30) / svgH;
    zoomScale = Math.max(0.08, Math.min(scaleW, scaleH, 1));
  } else {
    zoomScale = 0.3;
  }
  panX = 15; panY = 15;
  applyTransform();
}

function setupPanZoom(){
  const wrap = $('#topo-wrap');
  let dragging = false, lastX=0, lastY=0;
  wrap.addEventListener('mousedown', e=>{
    dragging = true; lastX = e.clientX; lastY = e.clientY; wrap.classList.add('grabbing');
  });
  window.addEventListener('mousemove', e=>{
    if(!dragging) return;
    panX += (e.clientX - lastX);
    panY += (e.clientY - lastY);
    lastX = e.clientX; lastY = e.clientY;
    applyTransform();
  });
  window.addEventListener('mouseup', ()=>{ dragging=false; wrap.classList.remove('grabbing'); });
  wrap.addEventListener('wheel', e=>{
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.08 : 0.08;
    zoomScale = Math.min(2.4, Math.max(0.3, zoomScale + delta));
    applyTransform();
  }, {passive:false});
  $('#zoom-in').addEventListener('click', ()=>{ zoomScale = Math.min(2.4, zoomScale+0.15); applyTransform(); });
  $('#zoom-out').addEventListener('click', ()=>{ zoomScale = Math.max(0.3, zoomScale-0.15); applyTransform(); });
  $('#zoom-reset').addEventListener('click', ()=>{
    zoomScale = 0.55; panX = -50; panY = -50; applyTransform();
  });
  // initial fit
  zoomScale = 0.55; panX = -50; panY = -50;
}

/* ---------- TABS ---------- */
function switchTab(name){
  $$('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  $('#view-topo').classList.toggle('active', name==='topo');
  $('#view-detail').classList.toggle('active', name==='detail');
}
$$('.tab-btn').forEach(b=> b.addEventListener('click', ()=> switchTab(b.dataset.tab)));

/* ---------- DETAIL PANEL ---------- */
function openDetail(locId){
  currentLocId = locId;
  editingDeviceId = null;
  switchTab('detail');
  renderDetail();
  highlightActiveLoc();
}

function statusBadge(status){
  const color = STATUS_COLOR[status] || 'var(--idle)';
  return `<span class="status-badge" style="background:rgba(255,255,255,0.05); color:${color}"><span class="d" style="background:${color}"></span>${status}</span>`;
}

function renderDetail(){
  const panel = $('#detail-panel');
  if(!currentLocId){
    panel.innerHTML = `<div class="empty-state"><div class="big-icon">⌁</div><div>Pilih gedung atau lokasi dari daftar / peta topologi<br>untuk melihat data perangkatnya.</div></div>`;
    return;
  }
  const loc = state.locations.find(l=>l.id===currentLocId);
  const zone = ZONES.find(z=>z.key===loc.zone);
  const devices = state.devices[currentLocId] || [];

  let rows = devices.map(d=>`
    <tr>
      <td>${escapeHtml(d.nama)}</td>
      <td>${escapeHtml(d.tipe)}</td>
      <td>${escapeHtml(d.merk||'—')}</td>
      <td class="ip-cell">${escapeHtml(d.ip||'—')}</td>
      <td>${statusBadge(d.status)}</td>
      <td>${escapeHtml(d.catatan||'—')}</td>
      <td><div class="row-actions">
        <button class="icon-btn" title="Ubah" onclick="editDevice('${d.id}')">✎</button>
        <button class="icon-btn danger" title="Hapus" onclick="deleteDevice('${d.id}')">✕</button>
      </div></td>
    </tr>
  `).join('');

  panel.innerHTML = `
    <button class="back-link" onclick="switchTab('topo')">← Kembali ke Peta Topologi</button>
    <div class="detail-head">
      <div>
        <h2>${escapeHtml(loc.nama)}</h2>
        <span class="zone-badge">${zone ? zone.label : loc.zone}</span>
      </div>
      <button class="add-btn" onclick="openDeviceForm()">+ Tambah Perangkat</button>
    </div>
    ${devices.length === 0 ? '<div class="no-devices">Belum ada perangkat terdata di lokasi ini.</div>' : `
    <table class="device-table">
      <thead><tr><th>Nama</th><th>Tipe</th><th>Merk/Model</th><th>IP Address</th><th>Status</th><th>Catatan</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`}
    <div class="device-form" id="device-form">
      <p class="form-title" id="form-title">Tambah Perangkat</p>
      <div class="form-grid">
        <div class="field"><label>Nama Perangkat</label><input id="f-nama" placeholder="cth. Switch Lantai 1"></div>
        <div class="field"><label>Tipe</label><select id="f-tipe">${DEVICE_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('')}</select></div>
        <div class="field"><label>Merk / Model</label><input id="f-merk" placeholder="cth. Cisco SG350"></div>
        <div class="field"><label>IP Address</label><input id="f-ip" placeholder="cth. 10.10.5.2"></div>
        <div class="field"><label>Status</label><select id="f-status">${STATUS_LIST.map(s=>`<option value="${s}">${s}</option>`).join('')}</select></div>
        <div class="field span-1"><label>&nbsp;</label></div>
        <div class="field span-3"><label>Catatan</label><textarea id="f-catatan" rows="2" placeholder="Catatan tambahan (opsional)"></textarea></div>
      </div>
      <div class="form-actions">
        <button class="btn-secondary" onclick="closeDeviceForm()">Batal</button>
        <button class="btn-primary" onclick="submitDeviceForm()">Simpan</button>
      </div>
    </div>
  `;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str==null? '' : String(str);
  return d.innerHTML;
}

function openDeviceForm(deviceId){
  editingDeviceId = deviceId || null;
  const form = $('#device-form');
  form.classList.add('open');
  $('#form-title').textContent = deviceId ? 'Ubah Perangkat' : 'Tambah Perangkat';
  if(deviceId){
    const d = (state.devices[currentLocId]||[]).find(x=>x.id===deviceId);
    if(d){
      $('#f-nama').value = d.nama; $('#f-tipe').value = d.tipe; $('#f-merk').value = d.merk||'';
      $('#f-ip').value = d.ip||''; $('#f-status').value = d.status; $('#f-catatan').value = d.catatan||'';
    }
  } else {
    $('#f-nama').value=''; $('#f-merk').value=''; $('#f-ip').value=''; $('#f-catatan').value='';
    $('#f-tipe').value = DEVICE_TYPES[0]; $('#f-status').value = 'Online';
  }
  form.scrollIntoView({behavior:'smooth', block:'nearest'});
  $('#f-nama').focus();
}

function closeDeviceForm(){
  editingDeviceId = null;
  const form = $('#device-form');
  if(form) form.classList.remove('open');
}

async function submitDeviceForm(){
  const nama = $('#f-nama').value.trim();
  if(!nama){ showToast('Nama perangkat wajib diisi'); $('#f-nama').focus(); return; }
  const payload = {
    nama, tipe: $('#f-tipe').value, merk: $('#f-merk').value.trim(),
    ip: $('#f-ip').value.trim(), status: $('#f-status').value, catatan: $('#f-catatan').value.trim()
  };
  if(!state.devices[currentLocId]) state.devices[currentLocId] = [];
  if(editingDeviceId){
    const list = state.devices[currentLocId];
    const idx = list.findIndex(d=>d.id===editingDeviceId);
    if(idx>-1) list[idx] = {...list[idx], ...payload};
  } else {
    state.devices[currentLocId].push({id: uid(), ...payload});
  }
  await saveData();
  renderDetail();
  renderSidebar();
  renderStats();
  renderTopology();
  showToast('Data perangkat tersimpan');
}

function editDevice(id){ openDeviceForm(id); }

async function deleteDevice(id){
  if(!confirm('Hapus perangkat ini dari daftar?')) return;
  state.devices[currentLocId] = (state.devices[currentLocId]||[]).filter(d=>d.id!==id);
  await saveData();
  renderDetail();
  renderSidebar();
  renderStats();
  renderTopology();
  showToast('Perangkat dihapus');
}

/* ---------- INIT ---------- */
async function init(){
  const loaded = await loadData();
  if(loaded){
    state = loaded;
    if(!state.devices) state.devices = {};
  } else {
    state = {locations: SEED_LOCATIONS, devices: {}};
    await saveData();
  }
  setupPanZoom();
  renderStats();
  renderSidebar();
  renderTopology();
  renderDetail();
}
init();
</script>
