<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sistem Kontrol Jaringan Pabrik</title>
  <link rel="icon" type="image/png" href="/assets/cba-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg      : #080f1c;
      --panel   : #0e1829;
      --border  : #1a2d4a;
      --accent  : #2fb8c6;
      --accent2 : #1a7e8a;
      --ok      : #5fbf7a;
      --text    : #dce6ee;
      --muted   : #5a7a98;
      --mono    : 'IBM Plex Mono', monospace;
      --sans    : 'IBM Plex Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: var(--sans);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(47,184,198,.15), transparent),
        linear-gradient(rgba(22,50,74,.45) 1px, transparent 1px),
        linear-gradient(90deg, rgba(22,50,74,.45) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      overflow: hidden;
      animation: grid-move 20s linear infinite;
    }

    @keyframes grid-move {
      0% { background-position: 0 0, 0 0, 0 0; }
      100% { background-position: 0 0, 40px 40px, 40px 40px; }
    }

    /* ── Animated grid lines ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, transparent 50%, rgba(47,184,198,.02) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      animation: scanline 8s linear infinite;
      z-index: 0;
    }

    @keyframes scanline {
      0%   { background-position: 0 0; }
      100% { background-position: 0 400px; }
    }

    /* ── Floating orbs ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: float 12s ease-in-out infinite;
    }
    .orb1 { width: 450px; height: 450px; background: rgba(47,184,198,.07); top:-120px; left:-80px; animation-delay:0s; }
    .orb2 { width: 380px; height: 380px; background: rgba(95,191,122,.05); bottom:-80px; right:-60px; animation-delay:-6s; }
    @keyframes float {
      0%,100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(30px,-20px) scale(1.05); }
      66%      { transform: translate(-20px,15px) scale(.97); }
    }

    /* ── Login card ── */
    @keyframes card-enter {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    .card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
      padding: 40px 36px 36px;
      background: rgba(14,24,41,.85);
      border: 1px solid rgba(47,184,198,.2);
      border-radius: 16px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 0 0 1px rgba(47,184,198,.08), 0 40px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
      animation: card-enter 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    
    /* Glowing top edge */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(47,184,198,.6), transparent);
    }

    /* ── Brand ── */
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }

    .logo-img {
      width: 44px; height: 44px;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 0 8px rgba(47,184,198,.4));
      animation: float-logo 4s ease-in-out infinite;
    }
    
    @keyframes float-logo {
      0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 8px rgba(47,184,198,.4)); }
      50% { transform: translateY(-4px); filter: drop-shadow(0 4px 12px rgba(47,184,198,.7)); }
    }

    .brand-text h1 {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: .5px;
    }
    .brand-text p {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
      margin-top: 3px;
    }

    /* ── Form ── */
    .form-title {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 18px;
    }
    .field label {
      display: block;
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--muted);
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: .8px;
    }
    .field input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(14,24,41,0.6);
      border: 1px solid rgba(47,184,198,0.2);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }
    .field input:hover {
      border-color: rgba(47,184,198,0.5);
      background: rgba(255,255,255,0.03);
    }
    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(47,184,198,.15), inset 0 2px 4px rgba(0,0,0,0.3);
      transform: translateY(-1px);
      background: rgba(255,255,255,0.05);
    }
    .field input::placeholder { color: rgba(90,122,152,.5); transition: color 0.3s; }
    .field input:focus::placeholder { color: rgba(90,122,152,.2); }

    /* ── Submit button ── */
    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #04202a;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .5px;
      transition: all .25s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(47,184,198,0.2);
    }
    .btn-login:hover { 
      background: #3fd0e0; 
      box-shadow: 0 8px 25px rgba(47,184,198,0.4);
      transform: translateY(-2px);
    }
    .btn-login:active { transform: translateY(1px) scale(.98); box-shadow: 0 2px 10px rgba(47,184,198,0.2); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }
    .btn-login.loading::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
      animation: shimmer 1.2s infinite;
    }
    @keyframes shimmer {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* ── Error message ── */
    .error-msg {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(224,102,63,.1);
      border: 1px solid rgba(224,102,63,.3);
      border-radius: 5px;
      color: #e0663f;
      font-family: var(--mono);
      font-size: 11.5px;
      text-align: center;
    }
    .error-msg.show { display: block; }

    /* ── Footer ── */
    .card-footer {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 10.5px;
      color: var(--muted);
      font-family: var(--mono);
    }
    .status-dot {
      display: inline-block;
      position: relative;
      width: 6px; height: 6px;
      background: var(--ok);
      border-radius: 50%;
      margin-right: 8px;
      box-shadow: 0 0 8px var(--ok);
    }
    .status-dot::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px solid var(--ok);
      animation: radar-ping 2.5s ease-out infinite;
    }
    @keyframes radar-ping {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(2.8); opacity: 0; }
    }
    .icon-btn {
      background: rgba(14,24,41,0.6);
      border: 1px solid rgba(47,184,198,0.2);
      color: var(--muted);
      width: 42px; height: 42px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .icon-btn:hover {
      border-color: rgba(47,184,198,0.5);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="card">
    <div class="brand">
      <img src="/assets/cba-logo.png" alt="CBA Logo" class="logo-img">
      <div class="brand-text">
        <h1>FACTORY NETCONTROL</h1>
        <p>Sistem Monitoring &amp; Kontrol Jaringan</p>
      </div>
    </div>

    <p class="form-title">// Autentikasi Pengguna</p>

    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               placeholder="masukkan username" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div style="display:flex;gap:6px">
          <input type="password" id="password" name="password"
                 placeholder="••••••••" autocomplete="new-password" required style="flex:1">
          <button type="button" class="icon-btn" onclick="togglePasswordVisibility('password', this)" title="Tampilkan Password" style="flex-shrink:0;height:42px;width:42px;display:flex;align-items:center;justify-content:center">👁️</button>
        </div>
      </div>
      <button type="submit" id="btn-login" class="btn-login">Masuk ke Sistem</button>
      <div class="error-msg" id="error-msg">Username atau password salah.</div>
    </form>

    <div class="card-footer">
      <span class="status-dot"></span>Sistem Jaringan Pabrik CBA
    </div>
  </div>

<script>
  function togglePasswordVisibility(id, btn) {
    const input = document.getElementById(id);
    if (!input) return;
    if (input.type === 'password') {
      input.type = 'text';
      btn.innerHTML = '🙈';
      btn.title = 'Sembunyikan Password';
    } else {
      input.type = 'password';
      btn.innerHTML = '👁️';
      btn.title = 'Tampilkan Password';
    }
  }

  // Jika sudah login, langsung redirect
  (function() {
    const token = localStorage.getItem('factory_jwt');
    if (!token) return;
    try {
      const p = JSON.parse(atob(token.split('.')[1]));
      if (p.exp * 1000 > Date.now()) window.location.replace('/');
      else localStorage.removeItem('factory_jwt');
    } catch (_) { localStorage.removeItem('factory_jwt'); }
  })();

  const form    = document.getElementById('login-form');
  const btn     = document.getElementById('btn-login');
  const errMsg  = document.getElementById('error-msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = 'Memverifikasi...';
    btn.classList.add('loading');
    errMsg.classList.remove('show');

    try {
      const res  = await fetch('/api/auth/login', {
        method : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body   : JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Login gagal');
      }

      // Simpan token dan info user
      localStorage.setItem('factory_jwt',  data.token);
      localStorage.setItem('factory_user', JSON.stringify(data.user));

      btn.textContent = '✓ Berhasil, memuat...';
      btn.classList.remove('loading');

      window.location.replace('/');
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Masuk ke Sistem';
      btn.classList.remove('loading');
      errMsg.textContent = err.message;
      errMsg.classList.add('show');
    }
  });
</script>
</body>
</html>
