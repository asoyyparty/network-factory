<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sistem Kontrol Jaringan Pabrik</title>
  <link rel="icon" type="image/png" href="/assets/logo.png?v=2.0">
  <link rel="shortcut icon" type="image/png" href="/assets/logo.png?v=2.0">
  <link rel="apple-touch-icon" href="/assets/logo.png?v=2.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Hallmark · component: auth-terminal · genre: modern-minimal · theme: cobalt-carbon */
    /* Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V5 */
    :root {
      --color-paper:       #0d1117;
      --color-paper-2:     #161b22;
      --color-paper-3:     #21262d;
      --color-ink:         #f0f6fc;
      --color-ink-2:       #8b949e;
      --color-ink-3:       #6e7681;
      --color-rule:        #30363d;
      --color-accent:      #388bfd;
      --color-accent-hover:#58a6ff;
      --color-focus:       #388bfd;
      --color-ok:          #3fb950;
      --color-warn:        #d29922;
      --color-alert:       #f85149;
      --mono:              'JetBrains Mono', monospace;
      --sans:              'Plus Jakarta Sans', -apple-system, sans-serif;

      /* Backward-compat aliases */
      --bg:      var(--color-paper);
      --panel:   var(--color-paper-2);
      --border:  var(--color-rule);
      --accent:  var(--color-accent);
      --ok:      var(--color-ok);
      --text:    var(--color-ink);
      --muted:   var(--color-ink-2);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--color-paper);
      font-family: var(--sans);
      color: var(--color-ink);
      overflow-x: clip;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* ── Terminal Card ── */
    @keyframes card-enter {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    
    .card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
      padding: 32px 28px 28px;
      background: var(--color-paper-2);
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      box-shadow: 
        0 20px 40px -15px rgba(0,0,0,0.8),
        0 0 0 1px var(--color-rule),
        inset 0 1px 0 rgba(255,255,255,0.06);
      animation: card-enter 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ── Brand Header ── */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--color-rule);
    }

    .logo-img {
      width: 36px; height: 36px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 700;
      color: var(--color-ink);
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    .brand-text p {
      font-size: 11px;
      color: var(--color-ink-2);
      font-family: var(--mono);
      margin-top: 3px;
    }

    /* ── Form Section ── */
    .form-title {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--color-ink-3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .form-title::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-accent);
    }

    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--color-ink-2);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .field input {
      width: 100%;
      padding: 10px 12px;
      background: var(--color-paper);
      border: 1px solid var(--color-rule);
      border-radius: 6px;
      color: var(--color-ink);
      font-family: var(--mono);
      font-size: 13px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      outline: none;
    }
    .field input:hover {
      border-color: #444c56;
      background: var(--color-paper-3);
    }
    .field input:focus, .field input:focus-visible {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 2px rgba(56,139,253,0.25);
      background: var(--color-paper);
    }
    .field input::placeholder { color: var(--color-ink-3); }

    /* ── Password Eye Button (Tactile) ── */
    .icon-btn {
      background: var(--color-paper);
      border: 1px solid var(--color-rule);
      color: var(--color-ink-2);
      width: 38px; height: 38px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease, transform 0.1s ease;
    }
    .icon-btn:hover {
      border-color: #444c56;
      background: var(--color-paper-3);
      color: var(--color-ink);
    }
    .icon-btn:active {
      transform: translateY(1px);
    }
    .icon-btn:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 1px;
    }

    /* ── Submit Button (8-State Telemetry) ── */
    .btn-login {
      width: 100%;
      padding: 11px 16px;
      background: var(--color-accent);
      border: 1px solid transparent;
      border-radius: 6px;
      color: #ffffff;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
      margin-top: 8px;
      position: relative;
    }
    .btn-login:hover { 
      background: var(--color-accent-hover); 
    }
    .btn-login:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }
    .btn-login:active {
      transform: translateY(1px);
    }
    .btn-login:disabled { 
      opacity: 0.6; 
      cursor: not-allowed; 
      transform: none;
    }

    /* ── Error Message ── */
    .error-msg {
      display: none;
      margin-top: 14px;
      padding: 10px 12px;
      background: rgba(248,81,73,0.1);
      border: 1px solid rgba(248,81,73,0.3);
      border-radius: 6px;
      color: var(--color-alert);
      font-family: var(--mono);
      font-size: 12px;
      text-align: center;
    }
    .error-msg.show { display: block; }

    /* ── Footer Status ── */
    .card-footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
      text-align: center;
      font-size: 11px;
      color: var(--color-ink-3);
      font-family: var(--mono);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .status-dot {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--color-ok);
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="/assets/cba-logo.png" alt="CBA Logo" class="logo-img">
      <div class="brand-text">
        <h1>FACTORY NETCONTROL</h1>
        <p>Sistem Monitoring &amp; Kontrol Jaringan</p>
      </div>
    </div>

    <p class="form-title">// Autentikasi Pengguna</p>

    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               placeholder="masukkan username" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div style="display:flex;gap:6px">
          <input type="password" id="password" name="password"
                 placeholder="••••••••" autocomplete="new-password" required style="flex:1">
          <button type="button" class="icon-btn" onclick="togglePasswordVisibility('password', this)" title="Tampilkan Password" style="flex-shrink:0;height:42px;width:42px;display:flex;align-items:center;justify-content:center">👁️</button>
        </div>
      </div>
      <button type="submit" id="btn-login" class="btn-login">Masuk ke Sistem</button>
      <div class="error-msg" id="error-msg">Username atau password salah.</div>
    </form>

    <div class="card-footer">
      <span class="status-dot"></span>Sistem Jaringan Pabrik CBA
    </div>
  </div>

<script>
  function togglePasswordVisibility(id, btn) {
    const input = document.getElementById(id);
    if (!input) return;
    if (input.type === 'password') {
      input.type = 'text';
      btn.innerHTML = '🙈';
      btn.title = 'Sembunyikan Password';
    } else {
      input.type = 'password';
      btn.innerHTML = '👁️';
      btn.title = 'Tampilkan Password';
    }
  }

  // Jika sudah login, langsung redirect
  (function() {
    const token = localStorage.getItem('factory_jwt');
    if (!token) return;
    try {
      const p = JSON.parse(atob(token.split('.')[1]));
      if (p.exp * 1000 > Date.now()) window.location.replace('/');
      else localStorage.removeItem('factory_jwt');
    } catch (_) { localStorage.removeItem('factory_jwt'); }
  })();

  const form    = document.getElementById('login-form');
  const btn     = document.getElementById('btn-login');
  const errMsg  = document.getElementById('error-msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = 'Memverifikasi...';
    btn.classList.add('loading');
    errMsg.classList.remove('show');

    try {
      const res  = await fetch('/api/auth/login', {
        method : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body   : JSON.stringify({ username, password })
      });
      
      let data = {};
      const contentType = res.headers.get('content-type') || '';
      if (contentType.includes('application/json')) {
        data = await res.json();
      } else {
        const text = await res.text();
        if (text.trim().startsWith('<')) {
          throw new Error(`Server mengembalikan halaman HTML (Status ${res.status}). Pastikan server backend berjalan.`);
        }
        try { data = JSON.parse(text); } catch (_) { throw new Error(`Format respons server tidak valid (${res.status})`); }
      }

      if (!res.ok) {
        throw new Error(data.error || 'Login gagal');
      }

      // Simpan token dan info user
      localStorage.setItem('factory_jwt',  data.token);
      localStorage.setItem('factory_user', JSON.stringify(data.user));

      btn.textContent = '✓ Berhasil, memuat...';
      btn.classList.remove('loading');

      window.location.replace('/');
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Masuk ke Sistem';
      btn.classList.remove('loading');
      errMsg.textContent = err.message;
      errMsg.classList.add('show');
    }
  });
</script>
</body>
</html>
