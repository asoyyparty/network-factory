<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sistem Kontrol Jaringan Pabrik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg      : #080f1c;
      --panel   : #0e1829;
      --border  : #1a2d4a;
      --accent  : #2fb8c6;
      --accent2 : #1a7e8a;
      --ok      : #5fbf7a;
      --text    : #dce6ee;
      --muted   : #5a7a98;
      --mono    : 'IBM Plex Mono', monospace;
      --sans    : 'IBM Plex Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: var(--sans);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(47,184,198,.13), transparent),
        linear-gradient(rgba(22,50,74,.45) 1px, transparent 1px),
        linear-gradient(90deg, rgba(22,50,74,.45) 1px, transparent 1px);
      background-size: 100% 100%, 34px 34px, 34px 34px;
      background-attachment: fixed;
      overflow: hidden;
    }

    /* ── Animated grid lines ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, transparent 50%, rgba(47,184,198,.02) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      animation: scanline 8s linear infinite;
      z-index: 0;
    }

    @keyframes scanline {
      0%   { background-position: 0 0; }
      100% { background-position: 0 400px; }
    }

    /* ── Floating orbs ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: float 12s ease-in-out infinite;
    }
    .orb1 { width: 450px; height: 450px; background: rgba(47,184,198,.07); top:-120px; left:-80px; animation-delay:0s; }
    .orb2 { width: 380px; height: 380px; background: rgba(95,191,122,.05); bottom:-80px; right:-60px; animation-delay:-6s; }
    @keyframes float {
      0%,100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(30px,-20px) scale(1.05); }
      66%      { transform: translate(-20px,15px) scale(.97); }
    }

    /* ── Login card ── */
    .card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
      padding: 40px 36px 36px;
      background: rgba(14,24,41,.92);
      border: 1px solid var(--border);
      border-radius: 12px;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 0 1px rgba(47,184,198,.08), 0 40px 80px rgba(0,0,0,.5);
    }

    /* ── Brand ── */
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }

    .logo {
      width: 44px; height: 44px;
      border: 2px solid var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      animation: pulse-border 2s ease-in-out infinite;
    }
    .logo::before {
      content: '';
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent);
    }
    .logo::after {
      content: '';
      position: absolute;
      width: 22px; height: 22px;
      border: 1.5px solid var(--accent2);
      border-radius: 50%;
    }

    @keyframes pulse-border {
      0%,100% { box-shadow: 0 0 0 0 rgba(47,184,198,.4); }
      50%      { box-shadow: 0 0 0 8px rgba(47,184,198,0); }
    }

    .brand-text h1 {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: .5px;
    }
    .brand-text p {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
      margin-top: 3px;
    }

    /* ── Form ── */
    .form-title {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 18px;
    }
    .field label {
      display: block;
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--muted);
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: .8px;
    }
    .field input {
      width: 100%;
      padding: 11px 14px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(47,184,198,.15);
    }
    .field input::placeholder { color: rgba(90,122,152,.6); }

    /* ── Submit button ── */
    .btn-login {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #04202a;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .5px;
      transition: background .2s, transform .1s;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }
    .btn-login:hover { background: #3fd0e0; }
    .btn-login:active { transform: scale(.98); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }
    .btn-login.loading::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
      animation: shimmer 1.2s infinite;
    }
    @keyframes shimmer {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* ── Error message ── */
    .error-msg {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(224,102,63,.1);
      border: 1px solid rgba(224,102,63,.3);
      border-radius: 5px;
      color: #e0663f;
      font-family: var(--mono);
      font-size: 11.5px;
      text-align: center;
    }
    .error-msg.show { display: block; }

    /* ── Footer ── */
    .card-footer {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 10.5px;
      color: var(--muted);
      font-family: var(--mono);
    }
    .status-dot {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--ok);
      border-radius: 50%;
      margin-right: 5px;
      box-shadow: 0 0 8px var(--ok);
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: .4; }
    }
  </style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="card">
    <div class="brand">
      <div class="logo"></div>
      <div class="brand-text">
        <h1>FACTORY NETCONTROL</h1>
        <p>Sistem Monitoring &amp; Kontrol Jaringan</p>
      </div>
    </div>

    <p class="form-title">// Autentikasi Pengguna</p>

    <form id="login-form" autocomplete="on">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               placeholder="masukkan username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-login" id="btn-login">Masuk ke Sistem</button>
      <div class="error-msg" id="error-msg"></div>
    </form>

    <div class="card-footer">
      <span class="status-dot"></span>Sistem aktif &amp; terhubung ke jaringan lokal
    </div>
  </div>

<script>
  // Jika sudah login, langsung redirect
  (function() {
    const token = localStorage.getItem('factory_jwt');
    if (!token) return;
    try {
      const p = JSON.parse(atob(token.split('.')[1]));
      if (p.exp * 1000 > Date.now()) window.location.replace('/');
      else localStorage.removeItem('factory_jwt');
    } catch (_) { localStorage.removeItem('factory_jwt'); }
  })();

  const form    = document.getElementById('login-form');
  const btn     = document.getElementById('btn-login');
  const errMsg  = document.getElementById('error-msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = 'Memverifikasi...';
    btn.classList.add('loading');
    errMsg.classList.remove('show');

    try {
      const res  = await fetch('/api/auth/login', {
        method : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body   : JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Login gagal');
      }

      // Simpan token dan info user
      localStorage.setItem('factory_jwt',  data.token);
      localStorage.setItem('factory_user', JSON.stringify(data.user));

      btn.textContent = '✓ Berhasil, memuat...';
      btn.classList.remove('loading');

      window.location.replace('/');
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Masuk ke Sistem';
      btn.classList.remove('loading');
      errMsg.textContent = err.message;
      errMsg.classList.add('show');
    }
  });
</script>
</body>
</html>
